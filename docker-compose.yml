version: "3.9"

services:
  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://elite:elite@db:5432/elite_simulator
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
      POSTGRES_DB: elite_simulator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_simulator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A src.services.settlement_service worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://elite:elite@db:5432/elite_simulator
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A src.services.settlement_service beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://elite:elite@db:5432/elite_simulator
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - db
      - redis

volumes:
  pgdata:
